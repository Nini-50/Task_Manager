<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Academic Task Manager</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <h1>📚 Academic Task Manager</h1>
        <div class="topbar-actions">
            <span class="current-user" sec:authentication="name"></span>
            <button id="syncCanvasBtn" class="btn btn-outline">Sync Canvas</button>
            <button id="uploadSyllabusBtn" class="btn btn-outline">Upload Syllabus</button>
            <button id="settingsBtn" class="btn btn-icon" title="Customize">⚙️</button>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="btn btn-outline">Log out</button>
            </form>
        </div>
    </header>


    <main class="dashboard-grid">
        <section class="card calendar-card">
            <div class="card-header">
                <h2>Calendar</h2>
                <div class="calendar-nav">
                    <button id="prevWeekBtn">‹</button>
                    <span id="calendarRangeLabel"></span>
                    <button id="nextWeekBtn">›</button>
                </div>
            </div>
            <div id="calendarBody" class="calendar-body"></div>
        </section>

        <section class="card todo-card">
            <div class="card-header">
                <h2>To-Do List</h2>
            </div>
            <form id="todoForm" class="todo-form">
                <input type="text" id="todoTitle" placeholder="Add a task..." required>
                <select id="todoPriority">
                    <option value="1">Low</option>
                    <option value="3" selected>Medium</option>
                    <option value="5">Urgent</option>
                </select>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>
            <ul id="todoList" class="todo-list"></ul>
        </section>

        <aside id="widgetPanel" class="widgets-panel"></aside>
    </main>
</div>

<!-- Settings / customization modal -->
<div id="settingsModal" class="modal hidden">
    <div class="modal-content">
        <h2>Customize Dashboard</h2>
        <form id="settingsForm">
            <label>Display name
                <input type="text" id="displayName">
            </label>
            <label>Theme color
                <div id="themeSwatches" class="theme-swatches">
                    <button type="button" class="swatch swatch-red" data-theme="red" title="Red"></button>
                    <button type="button" class="swatch swatch-orange" data-theme="orange" title="Orange"></button>
                    <button type="button" class="swatch swatch-yellow" data-theme="yellow" title="Yellow"></button>
                    <button type="button" class="swatch swatch-green" data-theme="green" title="Green"></button>
                    <button type="button" class="swatch swatch-teal" data-theme="teal" title="Teal"></button>
                    <button type="button" class="swatch swatch-light-blue" data-theme="light-blue" title="Light blue"></button>
                    <button type="button" class="swatch swatch-dark-blue" data-theme="dark-blue" title="Dark blue"></button>
                    <button type="button" class="swatch swatch-light-pink" data-theme="light-pink" title="Light pink"></button>
                    <button type="button" class="swatch swatch-hot-pink" data-theme="hot-pink" title="Hot pink"></button>
                    <button type="button" class="swatch swatch-lavender" data-theme="lavender" title="Lavender"></button>
                    <button type="button" class="swatch swatch-purple" data-theme="purple" title="Purple"></button>
                    <button type="button" class="swatch swatch-brown" data-theme="brown" title="Brown"></button>
                </div>
                <input type="hidden" id="themeColor">
            </label>
            <label>Theme mode
                <select id="themeMode">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </label>
            <fieldset>
                <legend>Widgets</legend>
                <label><input type="checkbox" id="weatherWidgetEnabled"> Weather</label>
                <input type="text" id="weatherLocation" placeholder="City, State">
                <label><input type="checkbox" id="sportsWidgetEnabled"> Sports</label>
                <input type="text" id="sportsTeam" placeholder="Favorite team">
            </fieldset>
            <fieldset>
                <legend>Canvas LMS Connection</legend>
                <label>Canvas base URL
                    <input type="text" id="canvasBaseUrl" placeholder="https://yourschool.instructure.com">
                </label>
                <label>Canvas API token
                    <input type="password" id="canvasApiToken" placeholder="Personal access token">
                </label>
            </fieldset>
            <div class="modal-actions">
                <button type="button" id="closeSettingsBtn" class="btn btn-outline">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Syllabus upload modal -->
<div id="syllabusModal" class="modal hidden">
    <div class="modal-content">
        <h2>Upload Syllabus</h2>
        <p class="hint">We'll scan the document for dated assignments, quizzes, and exams. Review before saving.</p>
        <input type="file" id="syllabusFile" accept=".pdf,.txt">
        <button id="previewSyllabusBtn" class="btn btn-primary">Preview Dates</button>
        <ul id="syllabusCandidates" class="todo-list"></ul>
        <div class="modal-actions">
            <button type="button" id="closeSyllabusBtn" class="btn btn-outline">Cancel</button>
            <button type="button" id="confirmSyllabusBtn" class="btn btn-primary">Save Selected</button>
        </div>
    </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
