<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · Academic Task Manager</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
<div class="auth-card">
    <h1>📚 Academic Task Manager</h1>
    <p class="auth-subtitle">Create an account to save your courses and assignments in this browser.</p>

    <p th:if="${error}" class="auth-error" th:text="${error}"></p>

    <form th:action="@{/register}" method="post" class="auth-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" th:value="${username}" minlength="3" maxlength="50" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <small>At least 8 characters.</small>

        <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a th:href="@{/login}">Log in</a></p>
</div>
</body>
</html>
