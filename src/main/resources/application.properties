spring.application.name=academic-task-manager

# --- Database (file-based H2 so data persists across restarts) ---
spring.datasource.url=jdbc:h2:file:./data/academic-task-manager;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- H2 web console, handy for inspecting data during development ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- File upload limits for syllabus documents ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

